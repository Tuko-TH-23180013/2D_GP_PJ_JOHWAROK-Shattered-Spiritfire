function render(state){
  const {ctx,image,item,frame}=state;
  if(!image.complete||!image.naturalWidth)return;
  state.drawn=frame;
  const [w,h]=item.frame_size;
  let ratio=w>160?.86:1.35;
  const [px,py]=item.pivot_top_left;
  const y=w===160 && py===80?118:197;
  const active=item.frames[frame].phase==="active";
  const recovery=item.frames[frame].phase==="recovery";
  const progress=state.manual?.65:state.time/item.frames[frame].duration_ms;
  const distances={guardian:46,jige:44,mask:32,sotdae:48,onggi:22,hahoe_thrust:18,hahoe_retaliate:27};
  const travel=distances[item.id]||0;
  const dx=active?travel*(progress-.25):(recovery?travel*.75:0);
  const dy=active&&item.id==="sotdae"?progress*42:0;
  ctx.clearRect(0,0,340,226);
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="#586566";
  ctx.fillRect(18,198,304,1);
  ctx.drawImage(image,frame*w,0,w,h,Math.round(170+dx-px*ratio),Math.round(y+dy-py*ratio),Math.round(w*ratio),Math.round(h*ratio));
  if (active && item.id==="ember") {
    const x=198+104*progress;
    ctx.fillStyle="#318e8a";ctx.fillRect(x-17,119,22,4);
    ctx.fillStyle="#9cf7d7";ctx.fillRect(x,116,8,8);
    ctx.fillStyle="#e0ffed";ctx.fillRect(x+3,118,4,4);
  }

const rates=[...document.querySelectorAll("[data-rate]")];

let last=performance.now();
function tick(now){
 const delta=Math.min(now-last,100)*rate;
 last=now;
 for(const state of cards){
   if(!delta||state.manual||state.finished)continue;
   state.time+=delta;
   if(state.time>=state.item.frames[state.frame].duration_ms){
     state.time-=state.item.frames[state.frame].duration_ms;
     const lastFrame=state.frame===state.item.frames.length-1;
     if(lastFrame&&state.item.playback==="once"){
       state.finished=true;
     }else{
       state.frame=(state.frame+1)%state.item.frames.length;
     }
   }
   render(state);
